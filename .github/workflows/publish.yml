# Publishes dynamic.envs with semantic-release.
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN.
# One-time setup: https://www.npmjs.com/package/dynamic.envs/access
#   Trusted Publisher → GitHub Actions
#   Organization or user: Yuri-Lima
#   Repository: JsonToEnv
#   Workflow filename: publish.yml
#   Allowed actions: npm publish
name: Publish NPM CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
